<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türk Nizam Hareketi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-official {
            background-color: #070a0f;
            background-image: radial-gradient(circle at 50% 40%, rgba(220, 38, 38, 0.15) 0%, transparent 60%);
        }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .gokturk-text {
            white-space: nowrap;
            animation: marquee 25s linear infinite;
        }
        @keyframes shine {
            0% { left: -100%; }
            100% { left: 200%; }
        }
        .card-shine::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(220, 38, 38, 0.15), transparent);
            transform: skewX(-25deg);
            animation: shine 6s infinite;
        }
    </style>
</head>
<body class="bg-official text-gray-100 min-h-screen flex items-center justify-center p-4 font-sans relative overflow-hidden">

    <!-- ARKA PLAN GÖKTÜRKÇE KAYAN YAZI -->
    <div class="absolute top-3 left-0 w-full overflow-hidden pointer-events-none opacity-20 text-red-500 font-bold text-xs tracking-widest">
        <div class="gokturk-text">𐱅𐰇𐰼𐰚 𐰤𐰃𐰔𐰀𐰢 &nbsp;&nbsp;&nbsp;&nbsp; 𐱅𐰇𐰼𐰚 𐰤𐰃𐰔𐰀𐰢 &nbsp;&nbsp;&nbsp;&nbsp; 𐱅𐰇𐰼𐰚 𐰤𐰃𐰔𐰀𐰢 &nbsp;&nbsp;&nbsp;&nbsp; 𐱅𐰇𐰼𐰚 𐰤𐰃𐰔𐰀𐰢</div>
    </div>

    <div class="w-full max-w-xl space-y-6 relative z-10">

        <!-- ÜYELİK KİMLİK KARTI -->
        <div class="bg-gray-900/90 border border-red-900/40 rounded-xl p-5 shadow-2xl relative overflow-hidden card-shine backdrop-blur-md">
            
            <!-- Arka Plan Silik Ayyıldız Filigranı -->
            <div class="absolute right-2 bottom-2 text-red-600/10 text-8xl font-black pointer-events-none select-none">
                ☾★
            </div>

            <div class="border-b border-red-900/40 pb-3 mb-4 flex justify-between items-center relative z-10">
                <div>
                    <h1 class="text-base font-black tracking-widest text-red-600 uppercase">TÜRK NİZAM HAREKETİ</h1>
                    <p class="text-[10px] text-gray-400 font-mono tracking-wider">ÜYELİK KİMLİĞİ</p>
                </div>
                <div class="text-xs font-bold text-gray-400 font-mono border border-red-900/50 px-2 py-0.5 rounded">T.N.H.</div>
            </div>

            <!-- Kimlik Gövdesi -->
            <div class="flex gap-4 items-center relative z-10">
                
                <!-- Vesikalık Fotoğraf Alanı -->
                <div class="relative group w-24 h-28 bg-gray-950 border border-gray-800 rounded-lg flex flex-col items-center justify-center overflow-hidden shrink-0 shadow-inner">
                    <img id="cardPhoto" src="" class="w-full h-full object-cover hidden">
                    <div id="photoPlaceholder" class="text-center p-2">
                        <svg class="w-7 h-7 mx-auto text-gray-600 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        <span class="text-[9px] text-gray-500 block leading-tight">Fotoğraf Yükle</span>
                    </div>
                    <input type="file" id="inputPhoto" accept="image/*" onchange="fotoYukle(event)" class="absolute inset-0 opacity-0 cursor-pointer">
                </div>

                <!-- Üye Bilgileri -->
                <div class="flex-grow space-y-2 text-xs font-mono">
                    <div>
                        <span class="text-[10px] text-gray-500 block uppercase">Ad Soyad / Kullanıcı Adı:</span>
                        <span id="cardName" class="font-bold text-white text-sm">----</span>
                    </div>
                    <div>
                        <span class="text-[10px] text-gray-500 block uppercase">E-Posta:</span>
                        <span id="cardEmail" class="text-gray-300">----</span>
                    </div>
                    <div>
                        <span class="text-[10px] text-gray-500 block uppercase">İlgi / Faaliyet Alanı:</span>
                        <span id="cardArea" class="text-red-500 font-bold">----</span>
                    </div>
                </div>
            </div>

            <div class="mt-4 pt-2 border-t border-gray-800/80 flex justify-between text-[9px] text-gray-500 font-mono relative z-10">
                <span>DURUM: MÜRACAAT</span>
                <span>TÜRK NİZAM HAREKETİ</span>
            </div>
        </div>

        <!-- GİRİŞ / KAYIT FORMU -->
        <div class="bg-gray-900/90 border border-gray-800 p-6 rounded-xl shadow-xl backdrop-blur-md">
            
            <div class="flex border-b border-gray-800 mb-6">
                <button id="tabGirisBtn" onclick="formDegistir('giris')" class="flex-1 py-2 text-xs font-bold text-red-600 border-b-2 border-red-600 transition">Giriş Yap</button>
                <button id="tabKayitBtn" onclick="formDegistir('kayit')" class="flex-1 py-2 text-xs font-bold text-gray-500 border-b-2 border-transparent transition">Kayıt Ol</button>
            </div>

            <!-- Giriş Formu -->
            <form id="formGiris" class="space-y-4" onsubmit="event.preventDefault(); textGiris();">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">E-Posta Adresi</label>
                    <input type="email" required class="w-full bg-gray-950 border border-gray-800 rounded p-2.5 text-sm text-white focus:border-red-600 outline-none transition">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Parola</label>
                    <input type="password" required class="w-full bg-gray-950 border border-gray-800 rounded p-2.5 text-sm text-white focus:border-red-600 outline-none transition">
                </div>
                <button class="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-2.5 rounded text-xs transition shadow-lg shadow-red-900/20">Giriş Yap</button>
            </form>

            <!-- Kayıt Formu -->
            <form id="formKayit" class="space-y-4 hidden" onsubmit="event.preventDefault(); textKayit();">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Ad Soyad veya Kullanıcı Adı</label>
                    <input type="text" id="inputName" oninput="kartGuncelle()" required class="w-full bg-gray-950 border border-gray-800 rounded p-2.5 text-sm text-white focus:border-red-600 outline-none transition">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">E-Posta Adresi</label>
                    <input type="email" id="inputEmail" oninput="kartGuncelle()" required class="w-full bg-gray-950 border border-gray-800 rounded p-2.5 text-sm text-white focus:border-red-600 outline-none transition">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Parola</label>
                    <input type="password" required class="w-full bg-gray-950 border border-gray-800 rounded p-2.5 text-sm text-white focus:border-red-600 outline-none transition">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Uzmanlık / İlgi Alanınız</label>
                    <input type="text" id="inputArea" oninput="kartGuncelle()" class="w-full bg-gray-950 border border-gray-800 rounded p-2.5 text-sm text-white focus:border-red-600 outline-none transition">
                </div>
                <button class="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-2.5 rounded text-xs transition shadow-lg shadow-red-900/20">Kayıt Başvurusunu Gönder</button>
            </form>

        </div>
    </div>

    <!-- Alt Göktürkçe Kayan Yazı -->
    <div class="absolute bottom-3 left-0 w-full overflow-hidden pointer-events-none opacity-20 text-red-500 font-bold text-xs tracking-widest">
        <div class="gokturk-text">𐱅𐰇𐰼𐰚 𐰤𐰃𐰔𐰀𐰢 &nbsp;&nbsp;&nbsp;&nbsp; 𐱅𐰇𐰼𐰚 𐰤𐰃𐰔𐰀𐰢 &nbsp;&nbsp;&nbsp;&nbsp; 𐱅𐰇𐰼𐰚 𐰤𐰃𐰔𐰀𐰢 &nbsp;&nbsp;&nbsp;&nbsp; 𐱅𐰇𐰼𐰚 𐰤𐰃𐰔𐰀𐰢</div>
    </div>

    <script>
        function kartGuncelle() {
            const name = document.getElementById('inputName').value;
            const email = document.getElementById('inputEmail').value;
            const area = document.getElementById('inputArea').value;

            document.getElementById('cardName').innerText = name.trim() !== "" ? name : "----";
            document.getElementById('cardEmail').innerText = email.trim() !== "" ? email : "----";
            document.getElementById('cardArea').innerText = area.trim() !== "" ? area : "----";
        }

        function fotoYukle(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const img = document.getElementById('cardPhoto');
                img.src = reader.result;
                img.classList.remove('hidden');
                document.getElementById('photoPlaceholder').classList.add('hidden');
            }
            if(event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        function formDegistir(tip) {
            const girisForm = document.getElementById('formGiris');
            const kayitForm = document.getElementById('formKayit');
            const girisBtn = document.getElementById('tabGirisBtn');
            const kayitBtn = document.getElementById('tabKayitBtn');

            if (tip === 'giris') {
                girisForm.classList.remove('hidden');
                kayitForm.classList.add('hidden');
                girisBtn.className = "flex-1 py-2 text-xs font-bold text-red-600 border-b-2 border-red-600 transition";
                kayitBtn.className = "flex-1 py-2 text-xs font-bold text-gray-500 border-b-2 border-transparent transition";
            } else {
                kayitForm.classList.remove('hidden');
                girisForm.classList.add('hidden');
                kayitBtn.className = "flex-1 py-2 text-xs font-bold text-red-600 border-b-2 border-red-600 transition";
                girisBtn.className = "flex-1 py-2 text-xs font-bold text-gray-500 border-b-2 border-transparent transition";
            }
        }

        function textGiris() { alert('Giriş altyapısı aktifleştiriliyor.'); }
        function textKayit() { alert('Kayıt başvurusu alındı.'); }
    </script>
</body>
    </html>
