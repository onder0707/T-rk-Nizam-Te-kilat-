<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türk Nizam Hareketi</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <style>
        /* Sade karanlık arka plan */
        .bg-official { background-color: #070a0f; }
        
        /* Kart döndürme efektleri */
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-official text-gray-100 min-h-screen flex items-center justify-center p-4 font-sans overflow-hidden relative">

    <div class="w-full max-w-xl relative z-10 perspective-1000">
        
        <!-- KART KAPSAYICI (FLIP İÇİN) -->
        <div id="cardContainer" class="relative w-full transition-transform duration-300 preserve-3d cursor-pointer" onclick="flipCard()">
            <div id="cardInner" class="relative w-full transition-transform duration-700 preserve-3d hover:shadow-xl">
                
                <!-- ÖN YÜZ (2. SS'DEKİ GİBİ SADE VE TEMİZ) -->
                <div class="backface-hidden bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-2xl relative overflow-hidden">
                    
                    <!-- Mor kutuyu ve yıldızı tamamen sildim -->
                    
                    <div class="border-b border-gray-800 pb-3 mb-4 flex justify-between items-center">
                        <div>
                            <h1 class="text-lg font-bold text-red-600 uppercase">TÜRK NİZAM HAREKETİ</h1>
                            <p class="text-xs text-gray-400 font-mono">ÜYELİK KİMLİĞİ</p>
                        </div>
                        <div class="text-sm font-bold text-gray-400 font-mono">T.N.H.</div>
                    </div>
                    <div class="flex gap-4 items-center relative z-10">
                        <div class="w-24 h-28 bg-gray-950 border border-gray-800 rounded-lg flex items-center justify-center overflow-hidden shrink-0 shadow-inner">
                            <span class="text-xs text-gray-600">FOTO YERİ</span>
                        </div>
                        <div class="flex-grow space-y-2 text-xs font-mono text-gray-300">
                            <div><span class="text-gray-500 uppercase">Ad Soyad:</span> <span id="cardName" class="font-bold text-white text-sm">----</span></div>
                            <div><span class="text-gray-500 uppercase">İlgi Alanı:</span> <span id="cardArea" class="font-bold text-red-500">----</span></div>
                        </div>
                    </div>
                    <div class="mt-4 pt-2 border-t border-gray-800 flex justify-between text-[10px] text-gray-500 font-mono relative z-10">
                        <span class="text-red-500 font-bold uppercase">DURUM: MÜRACAAT</span>
                        <span class="text-gray-600">TÜRK NİZAM HAREKETİ</span>
                    </div>
                </div>

                <!-- ARKA YÜZ (KAYIT SIRA NUMARASI) -->
                <div class="backface-hidden absolute top-0 left-0 w-full h-full bg-gray-900 border border-gray-800 rounded-xl p-8 flex flex-col items-center justify-center rotate-y-180">
                    <h2 class="text-gray-500 text-xs tracking-widest uppercase mb-3">Kayıt Sıra Numarası</h2>
                    <!-- Sıralı kayıt numarasını buraya basacağız -->
                    <div id="memberCount" class="text-6xl font-black text-white tracking-tighter shadow-lg">0000</div>
                    <p class="mt-5 text-[10px] text-gray-600 font-mono">Kaydınızın mülkiyet numarasıdır.</p>
                </div>
            </div>
        </div>

        <!-- FORM ALANI -->
        <div class="bg-gray-900 border border-gray-800 p-6 rounded-xl shadow-xl backdrop-blur-md mt-6 relative z-10">
            <div class="flex border-b border-gray-800 mb-5">
                <button id="tabGirisBtn" onclick="formDegistir('giris')" class="flex-1 py-2 text-xs font-bold text-red-600 border-b-2 border-red-600 transition">Giriş Yap</button>
                <button id="tabKayitBtn" onclick="formDegistir('kayit')" class="flex-1 py-2 text-xs font-bold text-gray-500 border-b-2 border-transparent transition">Kayıt Ol</button>
            </div>

            <!-- GİRİŞ FORMU -->
            <form id="formGiris" class="space-y-4">
                <input type="email" placeholder="E-Posta" class="w-full bg-gray-950 border border-gray-800 rounded p-3 text-sm text-white focus:border-red-600 focus:ring-1 focus:ring-red-600 outline-none transition shadow-inner">
                <input type="password" placeholder="Parola" class="w-full bg-gray-950 border border-gray-800 rounded p-3 text-sm text-white focus:border-red-600 focus:ring-1 focus:ring-red-600 outline-none transition shadow-inner">
                <button type="button" class="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-2.5 rounded text-xs transition">Giriş Yap</button>
            </form>

            <!-- KAYIT FORMU (İSTEDİĞİN DÖRT ALAN) -->
            <form id="formKayit" class="space-y-4 hidden">
                <input type="text" id="inputName" oninput="kartGuncelle()" placeholder="Ad-Soyad" class="w-full bg-gray-950 border border-gray-800 rounded p-3 text-sm text-white focus:border-red-600 focus:ring-1 focus:ring-red-600 outline-none transition shadow-inner">
                <input type="email" id="inputEmail" placeholder="E-Posta Adresi" class="w-full bg-gray-950 border border-gray-800 rounded p-3 text-sm text-white focus:border-red-600 focus:ring-1 focus:ring-red-600 outline-none transition shadow-inner">
                <input type="password" id="inputParola" placeholder="Parola Oluştur" class="w-full bg-gray-950 border border-gray-800 rounded p-3 text-sm text-white focus:border-red-600 focus:ring-1 focus:ring-red-600 outline-none transition shadow-inner">
                <input type="text" id="inputArea" oninput="kartGuncelle()" placeholder="İlgi Faaliyet Alanı" class="w-full bg-gray-950 border border-gray-800 rounded p-3 text-sm text-white focus:border-red-600 focus:ring-1 focus:ring-red-600 outline-none transition shadow-inner">
                <button type="button" onclick="kayitMüracaati()" class="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-2.5 rounded text-xs transition">Kayıt Başvurusunu Gönder</button>
            </form>
        </div>
    </div>

    <script>
        // Üye Numarası Sayaç (Örnek olarak)
        let memberId = 1;

        // Canlı Kimlik Güncelleme
        function kartGuncelle() {
            document.getElementById('cardName').innerText = document.getElementById('inputName').value || "----";
            document.getElementById('cardArea').innerText = document.getElementById('inputArea').value || "----";
        }

        // Kart Döndürme (Flip)
        function flipCard() {
            document.getElementById('cardInner').classList.toggle('rotate-y-180');
        }

        // Formlar Arası Geçiş
        function formDegistir(tip) {
            const g = document.getElementById('formGiris'); const k = document.getElementById('formKayit');
            const gBtn = document.getElementById('tabGirisBtn'); const kBtn = document.getElementById('tabKayitBtn');
            if(tip === 'giris') { g.classList.remove('hidden'); k.classList.add('hidden'); gBtn.className="flex-1 py-2 text-xs font-bold text-red-600 border-b-2 border-red-600 transition"; kBtn.className="flex-1 py-2 text-xs font-bold text-gray-500 border-b-2 border-transparent transition"; }
            else { k.classList.remove('hidden'); g.classList.add('hidden'); kBtn.className="flex-1 py-2 text-xs font-bold text-red-600 border-b-2 border-red-600 transition"; gBtn.className="flex-1 py-2 text-xs font-bold text-gray-500 border-b-2 border-transparent transition"; }
        }

        // Kayıt Müracaatı ve Sıra No
        function kayitMüracaati() {
            const countDisplay = document.getElementById('memberCount');
            // Numaramızı 0001 formatına getiriyoruz
            let formattedId = memberId.toString().padStart(4, '0');
            countDisplay.innerText = formattedId;
            memberId++;
            // Başvuru alındığına dair geri bildirim
            document.getElementById('phText').innerText = "BAŞVURU\nALINDI";
            showToast("Müracaat alındı. Sıra no: " + formattedId);
        }

        // Basit Toast Mesajı
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.innerText = msg;
            toast.className = "fixed top-4 right-4 bg-red-900 border border-red-500 text-white px-4 py-2 rounded shadow-2xl z-50 text-xs";
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Tilt (Eğim) Efekti
        const card = document.getElementById('cardContainer');
        document.addEventListener('mousemove', (e) => {
            const { offsetWidth: w, offsetHeight: h } = card;
            const { offsetX: x, offsetY: y } = e;
            const rotY = ((x / w) - 0.5) * 15;
            const rotX = ((y / h) - 0.5) * -15;
            card.style.transform = `rotateY(${rotY}deg) rotateX(${rotX}deg)`;
        });
        document.addEventListener('mouseleave', () => card.style.transform = 'rotateY(0) rotateX(0)');
    </script>
</body>
                    </html>
