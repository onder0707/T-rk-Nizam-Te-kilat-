<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Paneli - T.N.H.</title>
    <style>
        /* --- TEMEL TEMALANDIRMA (Orijinal Koyu Mavi Tema) --- */
        :root {
            /* 2. SS'deki renk kodları */
            --bg-color: #1a1a2e; /* Orijinal koyu mavi arka plan */
            --card-bg: #1e1e36; /* Kart arka planı */
            --input-bg: #10101f; /* Giriş kutusu arka planı */
            --text-color-primary: #e0e0e0; 
            --text-color-secondary: #8a8a99; /* Daha modern, soluk mavi-gri */
            --accent-color: #e53935; /* Orijinal kırmızı vurgu */
            --border-color: #2a2a44; /* Modern, ince kenarlıklar */
            --font-family: 'Montserrat', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color-primary);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* Dış taşırma olmasın */
        }

        /* --- ANA KONTEYNER (Mobil Telefon Ekranı Simülasyonu) --- */
        .mobile-screen {
            width: 90vw;
            height: calc(100vh - 10px); /* Üstte ve altta 5px boşluk */
            margin-top: 5px;
            max-width: 400px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 20px;
            padding-bottom: 50px; /* Nav bar için yer */
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative; /* Status bar ve nav bar için */
        }

        /* --- KİMLİK KARTI (Üst Kutu) --- */
        .id-card {
            width: 90%;
            margin: 0 auto;
            margin-bottom: 25px;
            border-radius: 10px;
            padding: 15px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            position: relative;
            box-sizing: border-box;
            font-size: 11px;
        }

        .id-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .id-title-main {
            color: var(--accent-color);
            font-weight: 700;
            font-size: 14px;
            margin: 0;
            text-transform: uppercase;
        }

        .id-title-sub {
            color: var(--text-color-primary);
            font-size: 10px;
            margin: 2px 0 0 0;
            opacity: 0.8;
        }

        .id-abbreviation {
            color: var(--text-color-secondary);
            font-weight: lighter;
            font-size: 11px;
        }

        .id-body {
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
        }

        /* Modernleştirilmiş Fotoğraf Çerçevesi */
        .id-photo-container {
            width: 75px;
            height: 90px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            background-color: black; /* Resim gelince tam kaplasın */
            overflow: hidden;
            border-radius: 6px;
        }

        /* Fotoğrafın tam ekran sığması için düzeltme */
        .id-photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Resmi en-boy oranını bozmadan çerçeveyi tamamen dolduracak şekilde sığdırır */
            position: absolute;
            top: 0;
            left: 0;
        }

        .id-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .id-field-label {
            color: var(--text-color-secondary);
            text-transform: uppercase;
            font-size: 9px;
            letter-spacing: 0.5px;
        }

        .id-field-value {
            color: var(--text-color-primary);
            font-size: 11px;
            font-weight: 500;
            height: 1.2em;
            display: block;
        }

        .id-footer {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: var(--text-color-secondary);
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
            opacity: 0.7;
        }

        /* --- FORM KARTI (Alt Kutu) --- */
        .form-card {
            width: 90%;
            margin: 0 auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            border-radius: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Modern Sekmeler */
        .tabs {
            display: flex;
            height: 50px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: var(--text-color-secondary);
            transition: color 0.3s, background-color 0.3s;
            font-weight: 600;
            font-size: 14px;
        }

        .tab.active {
            color: var(--accent-color);
            background-color: rgba(229, 57, 53, 0.05); /* Çok hafif kırmızı arka plan */
        }

        /* Form İçeriği */
        .tab-content {
            flex: 1;
            overflow-y: auto; /* Gerektiğinde kaydırılabilir */
            padding: 20px;
            display: none; /* Varsayılan olarak gizli */
        }

        .tab-content.active {
            display: block; /* Aktif sekme içeriği gösterilir */
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-color-primary);
            opacity: 0.9;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background-color: var(--card-bg); /* Input içi kart renginde */
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color-primary);
            box-sizing: border-box;
            font-size: 13px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 5px rgba(229, 57, 53, 0.3);
        }

        /* Örnek yazılar kaldırıldı (placeholder boş) */

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #b71c1c;
        }

        .submit-btn:active {
            transform: translateY(1px);
        }

        /* --- MOBİL NAVİGASYON VE DURUM ÇUBUKLARI --- */
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 20px;
            background-color: black;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            box-sizing: border-box;
            color: #ddd;
            font-size: 11px;
            z-index: 10;
        }

        .status-bar-icons {
            display: flex;
            gap: 5px;
        }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
            border-top: 1px solid var(--border-color);
            z-index: 10;
        }

        .nav-icon {
            color: var(--text-color-secondary);
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
        <!-- Gerçek Mobil Ekran Simülasyonu -->
    <div class="mobile-screen">
        <!-- Durum Çubuğu -->
        <div class="status-bar">
            <span>22:26</span>
            <div class="status-bar-icons">
                <span>4G+</span>
                <span>%9</span>
            </div>
        </div>

        <!-- ÜST KISIM: KİMLİK KARTI -->
        <div class="id-card">
            <div class="id-card-header">
                <div>
                    <h1 class="id-title-main">TÜRK NİZAM HAREKETİ</h1>
                    <p class="id-title-sub">RESMİ ÜYELİK KİMLİĞİ</p>
                </div>
                <div class="id-abbreviation">T.N.H.</div>
            </div>

            <div class="id-body">
                <!-- Fotoğraf Çerçevesi -->
                <div class="id-photo-container" onclick="document.getElementById('photoInput').click()">
                    <!-- Varsayılan bir resim veya boş yer tutucu -->
                    <img id="idPhotoPreview" src="" alt="Vesika" style="display:none;">
                </div>

                <!-- Dinamik Kimlik Bilgileri -->
                <div class="id-details">
                    <div class="id-field">
                        <span class="id-field-label">Ad Soyad</span>
                        <span class="id-field-value" id="idNameValue"></span>
                    </div>
                    <div class="id-field">
                        <span class="id-field-label">Uzmanlık Alanı</span>
                        <span class="id-field-value" id="idExpertiseValue"></span>
                    </div>
                </div>
            </div>

            <div class="id-footer">
                <span>DURUM: MÜRACAAT</span>
                <span>TÜRK NİZAM HAREKETİ</span>
            </div>
        </div>

        <!-- ALT KISIM: FORM KARTI -->
        <div class="form-card">
            <div class="tabs">
                <div class="tab active" id="tabLogin" onclick="switchTab('login')">Giriş Yap</div>
                <div class="tab" id="tabRegister" onclick="switchTab('register')">Kayıt Ol</div>
            </div>

            <!-- GİRİŞ FORMU İÇERİĞİ (Varsayılan aktif) -->
            <div class="tab-content active" id="contentLogin">
                <form id="loginForm">
                    <div class="input-group">
                        <label for="loginUser">Ad Soyad veya Kullanıcı Adı</label>
                        <input type="text" id="loginUser" name="loginUser" required>
                    </div>

                    <div class="input-group">
                        <label for="loginPassword">Parola</label>
                        <input type="password" id="loginPassword" name="loginPassword" required>
                    </div>

                    <button type="submit" class="submit-btn">Giriş Yap</button>
                </form>
            </div>

            <!-- KAYIT FORMU İÇERİĞİ -->
            <div class="tab-content" id="contentRegister">
                <form id="registerForm">
                    <div class="input-group">
                        <label for="regFullName">Ad Soyad</label>
                        <input type="text" id="regFullName" name="regFullName" placeholder="" required oninput="updateIdCard('idNameValue', this.value)">
                    </div>

                    <div class="input-group">
                        <label for="regEmail">E-Posta Adresi</label>
                        <input type="email" id="regEmail" name="regEmail" placeholder="" required>
                    </div>

                    <div class="input-group">
                        <label for="regPassword">Parola</label>
                        <input type="password" id="regPassword" name="regPassword" placeholder="" required>
                    </div>

                    <div class="input-group">
                        <label for="regExpertise">Uzmanlık / İlgi Alanınız</label>
                        <input type="text" id="regExpertise" name="regExpertise" placeholder="" required oninput="updateIdCard('idExpertiseValue', this.value)">
                    </div>

                    <!-- Gizli dosya girişi -->
                    <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="previewPhoto(this)">

                    <button type="submit" class="submit-btn">Kayıt Başvurusunu Gönder</button>
                </form>
            </div>
        </div>

        <!-- Mobil Navigasyon Taklidi -->
        <div class="bottom-nav">
            <div class="nav-icon">|||</div>
            <div class="nav-icon">○</div>
            <div class="nav-icon"><</div>
        </div>
    </div>

    <script>
        // Metin alanlarını anında kimlikte güncelleme fonksiyonu
        function updateIdCard(elementId, value) {
            document.getElementById(elementId).innerText = value;
        }

        // Fotoğraf yükleme ve tam ekran sığdırma fonksiyonu
        function previewPhoto(input) {
            const file = input.files[0];
            const preview = document.getElementById('idPhotoPreview');

            if (file) {
                const reader = new FileReader();

                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block'; // Resmi göster
                }

                reader.readAsDataURL(file); // Dosyayı oku
            }
        }

        // Giriş Yap/Kayıt Ol sekme değiştirme fonksiyonu
        function switchTab(tabName) {
            // Tüm içerikleri gizle
            document.getElementById('contentLogin').classList.remove('active');
            document.getElementById('contentRegister').classList.remove('active');
            // Tüm sekmelerin aktifliğini kaldır
            document.getElementById('tabLogin').classList.remove('active');
            document.getElementById('tabRegister').classList.remove('active');

            // Seçilen içeriği göster ve sekmeyi aktif yap
            if (tabName === 'login') {
                document.getElementById('contentLogin').classList.add('active');
                document.getElementById('tabLogin').classList.add('active');
            } else if (tabName === 'register') {
                document.getElementById('contentRegister').classList.add('active');
                document.getElementById('tabRegister').classList.add('active');
            }
        }
    </script>
</body>
</html>
