<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Paneli - T.N.H.</title>
    <style>
        /* TEMEL TEMALANDIRMA (Koyu Tema) */
        :root {
            --bg-color: #101015; /* Çok koyu gri-siyah */
            --card-bg: #1a1a20; /* Kart arka planı */
            --text-color-primary: #e0e0e0; /* Açık gri metin */
            --text-color-secondary: #909090; /* Soluk metin */
            --accent-color: #d32f2f; /* Vurgu Kırmızısı */
            --input-bg: #121217; /* Giriş kutusu arka planı */
            --input-border: #2a2a30; /* Giriş kutusu kenarlığı */
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color-primary);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        /* ANA KONTEYNER */
        .container {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ORTAK KART STİLİ */
        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        /* --- KİMLİK KARTI STİLLERİ --- */
        .id-card {
            font-size: 11px;
            position: relative;
            color: var(--text-color-primary);
        }

        .id-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .id-title-main {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 14px;
            margin: 0;
        }

        .id-title-sub {
            color: var(--text-color-primary);
            font-size: 10px;
            margin: 2px 0 0 0;
            font-weight: lighter;
        }

        .id-abbreviation {
            color: var(--text-color-primary);
            font-weight: lighter;
        }

        .id-body {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        /* Fotoğraf Alanı */
        .id-photo-container {
            width: 70px;
            height: 85px;
            border: 1px solid var(--input-border);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            background-color: var(--input-bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .id-photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .id-photo-placeholder {
            font-size: 24px;
            color: var(--text-color-secondary);
        }

        .id-photo-text {
            font-size: 8px;
            color: var(--text-color-secondary);
            margin-top: 5px;
            display: block;
        }

        /* Veri Alanları */
        .id-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .id-field-label {
            color: var(--text-color-secondary);
            text-transform: uppercase;
            font-size: 9px;
            margin-bottom: 1px;
        }

        .id-field-value {
            color: var(--text-color-primary);
            font-size: 11px;
            height: 1.2em;
            display: block;
        }

        .id-footer {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: var(--text-color-secondary);
            border-top: 1px solid var(--input-border);
            padding-top: 8px;
        }

        /* --- FORM KARTI STİLLERİ --- */
        .form-card {
            border-top: 3px solid var(--accent-color);
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--input-border);
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 0;
            cursor: pointer;
            flex: 1;
            text-align: center;
            color: var(--text-color-secondary);
            transition: color 0.3s;
        }

        .tab.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
            margin-bottom: -1px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            color: var(--text-color-primary);
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 4px;
            color: var(--text-color-primary);
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #b71c1c;
        }

        /* Mobil Navigasyon Çubuğu Taklidi */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 50px;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            border-top: 1px solid var(--input-border);
        }

        .nav-icon {
            color: var(--text-color-secondary);
            font-size: 18px;
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- 1. KISIM: KİMLİK ÖNİZLEMESİ -->
        <div class="card id-card">
            <div class="id-card-header">
                <div>
                    <h1 class="id-title-main">TÜRK NİZAM HAREKETİ</h1>
                    <p class="id-title-sub">RESMİ ÜYELİK KİMLİĞİ</p>
                </div>
                <div class="id-abbreviation">T.N.H.</div>
            </div>

            <div class="id-body">
                <!-- Fotoğraf Yükleme ve Önizleme -->
                <div class="id-photo-container" onclick="document.getElementById('photoInput').click()">
                    <span id="placeholder" class="id-photo-placeholder">👤</span>
                    <img id="idPhotoPreview" src="" alt="Vesika" style="display:none;">
                    <br><span id="photoText" class="id-photo-text">Fotoğraf Ekle</span>
                </div>

                <!-- Dinamik Bilgiler -->
                <div class="id-details">
                    <div class="id-field">
                        <span class="id-field-label">Ad Soyad</span>
                        <span class="id-field-value" id="idNameValue"></span>
                    </div>
                    <!-- E-POSTA KALDIRILDI -->
                    <div class="id-field">
                        <span class="id-field-label">Uzmanlık Alanı</span>
                        <span class="id-field-value" id="idExpertiseValue"></span>
                    </div>
                </div>
            </div>

            <div class="id-footer">
                <span>DURUM: MÜRACAAT</span>
                <span>TÜRK NİZAM HAREKETİ</span>
            </div>
        </div>

        <!-- 2. KISIM: KAYIT FORMU -->
        <div class="card form-card">
            <div class="tabs">
                <div class="tab">Giriş Yap</div>
                <div class="tab active">Kayıt Ol</div>
            </div>

            <!-- Kayıt Formu -->
            <form id="registerForm">
                <div class="input-group">
                    <label for="fullName">Ad Soyad</label>
                    <!-- JavaScript tetikleyicisi 'oninput' ile gerçek zamanlı güncelleme -->
                    <input type="text" id="fullName" name="fullName" placeholder="Örn: Ahmet Yılmaz" required oninput="updateIdCard('idNameValue', this.value)">
                </div>

                <div class="input-group">
                    <label for="email">E-Posta Adresi</label>
                    <!-- Soruluyor ama Kimlikte gözükmüyor -->
                    <input type="email" id="email" name="email" placeholder="Örn: adiniz@ornek.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Parola</label>
                    <input type="password" id="password" name="password" placeholder="Parolanız" required>
                </div>

                <div class="input-group">
                    <label for="expertise">Uzmanlık / İlgi Alanınız</label>
                    <!-- JavaScript tetikleyicisi 'oninput' ile gerçek zamanlı güncelleme -->
                    <input type="text" id="expertise" name="expertise" placeholder="Örn: Yazılım, Tarih" required oninput="updateIdCard('idExpertiseValue', this.value)">
                </div>

                <!-- Gizli dosya girişi -->
                <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="previewPhoto(this)">

                <button type="submit" class="submit-btn">Kayıt Başvurusunu Gönder</button>
            </form>
        </div>
    </div>

    <!-- Mobil Navigasyon Taklidi -->
    <div class="bottom-nav">
        <div class="nav-icon">|||</div>
        <div class="nav-icon">○</div>
        <div class="nav-icon"><</div>
    </div>

    <script>
        // Metin alanlarını anında kimlikte güncelleme fonksiyonu
        function updateIdCard(elementId, value) {
            document.getElementById(elementId).innerText = value;
        }

        // Fotoğraf yükleme ve önizleme fonksiyonu
        function previewPhoto(input) {
            const file = input.files[0];
            const preview = document.getElementById('idPhotoPreview');
            const placeholder = document.getElementById('placeholder');
            const photoText = document.getElementById('photoText');

            if (file) {
                const reader = new FileReader();

                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block'; // Resmi göster
                    placeholder.style.display = 'none'; // Yer tutucuyu gizle
                    photoText.style.display = 'none'; // Yazıyı gizle
                }

                reader.readAsDataURL(file); // Dosyayı oku
            } else {
                // Dosya seçilmezse eski haline getir
                preview.src = '';
                preview.style.display = 'none';
                placeholder.style.display = 'block';
                photoText.style.display = 'block';
            }
        }
    </script>
</body>
    </html>
