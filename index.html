<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türk Nizam Hareketi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-official { background-color: #070a0f; }
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        @keyframes shine { 0% { left: -100%; } 100% { left: 200%; } }
        .card-shine::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(220, 38, 38, 0.15), transparent);
            transform: skewX(-25deg); animation: shine 6s infinite;
        }
        .form-fade { transition: opacity 0.4s ease-in-out; }
    </style>
</head>
<body class="bg-official text-gray-100 min-h-screen flex items-center justify-center p-4 font-sans relative overflow-hidden">

    <!-- TOAST BİLDİRİM ALANI -->
    <div id="toast" class="fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-500">
        <div id="toastMsg" class="bg-red-900 border border-red-500 text-white px-6 py-3 rounded-lg shadow-2xl font-bold text-sm"></div>
    </div>

    <div class="w-full max-w-xl relative z-10 perspective-1000">
        
        <!-- KART KAPSAYICI (TILT VE FLIP İÇİN) -->
        <div id="cardContainer" class="relative w-full transition-transform duration-300 preserve-3d cursor-pointer" onclick="flipCard()">
            <div id="cardInner" class="relative w-full transition-transform duration-700 preserve-3d">
                
                <!-- ÖN YÜZ -->
                <div class="backface-hidden bg-gray-900/90 border border-red-900/40 rounded-xl p-5 shadow-2xl relative overflow-hidden card-shine backdrop-blur-md">
                    <div class="absolute right-2 bottom-2 text-red-600/10 text-8xl font-black select-none">☾★</div>
                    <div class="border-b border-red-900/40 pb-3 mb-4 flex justify-between items-center relative z-10">
                        <div>
                            <h1 class="text-base font-black tracking-widest text-red-600 uppercase">TÜRK NİZAM HAREKETİ</h1>
                            <p class="text-[10px] text-gray-400 font-mono tracking-wider">ÜYELİK KİMLİĞİ</p>
                        </div>
                        <div class="text-xs font-bold text-gray-400 font-mono border border-red-900/50 px-2 py-0.5 rounded">T.N.H.</div>
                    </div>
                    <div class="flex gap-4 items-center relative z-10">
                        <div class="w-24 h-28 bg-gray-950 border border-gray-800 rounded-lg flex items-center justify-center overflow-hidden shrink-0">
                            <img id="cardPhoto" src="" class="w-full h-full object-cover hidden">
                            <span id="phText" class="text-[9px] text-gray-500">FOTO</span>
                        </div>
                        <div class="flex-grow space-y-2 text-xs font-mono">
                            <div><span class="text-[9px] text-gray-500 uppercase">Ad Soyad:</span><span id="cardName" class="block font-bold text-white text-sm">----</span></div>
                            <div><span class="text-[9px] text-gray-500 uppercase">İlgi Alanı:</span><span id="cardArea" class="block text-red-500 font-bold">----</span></div>
                        </div>
                    </div>
                    <div class="mt-4 pt-2 border-t border-gray-800/80 flex justify-between text-[9px] text-gray-500 font-mono">
                        <span class="animate-pulse text-red-500 font-bold">DURUM: MÜRACAAT</span>
                        <span>TÜRK NİZAM HAREKETİ</span>
                    </div>
                </div>

                <!-- ARKA YÜZ -->
                <div class="backface-hidden absolute top-0 left-0 w-full h-full bg-gray-900/95 border border-red-900/40 rounded-xl p-8 flex flex-col items-center justify-center rotate-y-180">
                    <h2 class="text-gray-500 text-xs tracking-widest uppercase mb-4">Üyelik Numarası</h2>
                    <div id="memberIdDisplay" class="text-5xl font-black text-white tracking-tighter">#000</div>
                    <p class="mt-6 text-[10px] text-gray-600">Bu kimlik dijital mülkiyetinizdir.</p>
                </div>
            </div>
        </div>

        <!-- FORM ALANI -->
        <div class="bg-gray-900/90 border border-gray-800 p-6 rounded-xl shadow-xl backdrop-blur-md mt-6">
            <div class="flex border-b border-gray-800 mb-6">
                <button id="tabGirisBtn" onclick="formDegistir('giris')" class="flex-1 py-2 text-xs font-bold text-red-600 border-b-2 border-red-600 transition">Giriş Yap</button>
                <button id="tabKayitBtn" onclick="formDegistir('kayit')" class="flex-1 py-2 text-xs font-bold text-gray-500 border-b-2 border-transparent transition">Kayıt Ol</button>
            </div>

            <form id="formGiris" class="space-y-4 form-fade">
                <input type="email" placeholder="E-Posta" class="w-full bg-gray-950 border border-gray-800 rounded p-3 text-sm text-white focus:border-red-600 focus:ring-1 focus:ring-red-600 outline-none transition">
                <input type="password" placeholder="Parola" class="w-full bg-gray-950 border border-gray-800 rounded p-3 text-sm text-white focus:border-red-600 focus:ring-1 focus:ring-red-600 outline-none transition">
                <button type="button" onclick="showToast('Giriş altyapısı aktif.')" class="w-full bg-red-700 text-white font-bold py-3 rounded text-xs transition hover:bg-red-800">Giriş Yap</button>
            </form>

            <form id="formKayit" class="space-y-4 form-fade hidden">
                <input type="text" id="inputName" oninput="kartGuncelle()" placeholder="Ad Soyad" class="w-full bg-gray-950 border border-gray-800 rounded p-3 text-sm text-white focus:border-red-600 focus:ring-1 focus:ring-red-600 outline-none transition">
                <input type="email" id="inputEmail" placeholder="E-Posta" class="w-full bg-gray-950 border border-gray-800 rounded p-3 text-sm text-white focus:border-red-600 focus:ring-1 focus:ring-red-600 outline-none transition">
                <input type="text" id="inputArea" oninput="kartGuncelle()" placeholder="İlgi Alanı" class="w-full bg-gray-950 border border-gray-800 rounded p-3 text-sm text-white focus:border-red-600 focus:ring-1 focus:ring-red-600 outline-none transition">
                <button type="button" onclick="kayitOl()" class="w-full bg-red-700 text-white font-bold py-3 rounded text-xs transition hover:bg-red-800">Kayıt Başvurusunu Gönder</button>
            </form>
        </div>
    </div>

    <script>
        // Üye Numarası Sistemi
        let memberCount = parseInt(localStorage.getItem('memberCount') || 100);

        function kartGuncelle() {
            document.getElementById('cardName').innerText = document.getElementById('inputName').value || "----";
            document.getElementById('cardArea').innerText = document.getElementById('inputArea').value || "----";
        }

        function flipCard() {
            document.getElementById('cardInner').classList.toggle('rotate-y-180');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const msgDiv = document.getElementById('toastMsg');
            msgDiv.innerText = msg;
            toast.classList.remove('translate-x-full');
            setTimeout(() => toast.classList.add('translate-x-full'), 3000);
        }

        function kayitOl() {
            memberCount++;
            localStorage.setItem('memberCount', memberCount);
            document.getElementById('memberIdDisplay').innerText = "#" + memberCount;
            showToast("Başvuru alındı! Üye no: #" + memberCount);
        }

        function formDegistir(tip) {
            const g = document.getElementById('formGiris');
            const k = document.getElementById('formKayit');
            const gBtn = document.getElementById('tabGirisBtn');
            const kBtn = document.getElementById('tabKayitBtn');
            
            if(tip === 'giris') { g.classList.remove('hidden'); k.classList.add('hidden'); gBtn.className="flex-1 py-2 text-xs font-bold text-red-600 border-b-2 border-red-600 transition"; kBtn.className="flex-1 py-2 text-xs font-bold text-gray-500 border-b-2 border-transparent transition"; }
            else { k.classList.remove('hidden'); g.classList.add('hidden'); kBtn.className="flex-1 py-2 text-xs font-bold text-red-600 border-b-2 border-red-600 transition"; gBtn.className="flex-1 py-2 text-xs font-bold text-gray-500 border-b-2 border-transparent transition"; }
        }

        // Tilt Efekti
        const card = document.getElementById('cardContainer');
        document.addEventListener('mousemove', (e) => {
            const { offsetWidth: w, offsetHeight: h } = card;
            const { offsetX: x, offsetY: y } = e;
            const rotY = ((x / w) - 0.5) * 20;
            const rotX = ((y / h) - 0.5) * -20;
            card.style.transform = `rotateY(${rotY}deg) rotateX(${rotX}deg)`;
        });
        document.addEventListener('mouseleave', () => card.style.transform = 'rotateY(0) rotateX(0)');
    </script>
</body>
</html>
